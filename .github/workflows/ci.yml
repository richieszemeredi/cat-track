# CatTrack CI: quality gates on every push/PR, Firebase Hosting deploys after.
#
# Required repository configuration (see README "CI & deploys"):
#   Secrets:   FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 — uploaded by
#              `firebase init hosting:github`; the name is the CLI's own, kept
#              so the key it minted is the only one that ever exists.
#   Variables: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#              VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#              VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# The deploy jobs fail until those exist — that is intentional, not a flake.
#
# These are the ONLY workflows allowed to deploy. `firebase init hosting:github`
# also writes firebase-hosting-{merge,pull-request}.yml, which trigger on the
# same events but skip the quality gates AND build without the VITE_FIREBASE_*
# config — an ungated deploy of a bundle with no Firebase config. They were
# deleted; if the CLI regenerates them, delete them again.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests (with coverage)
        run: npm run test

      # test:rules and test:e2e wrap `firebase emulators:exec`; the Firestore
      # emulator needs a JDK on the runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # E2E runs on Safari (iPhone 14 Pro, WebKit) and Chrome (Pixel 7) —
      # install webkit plus chromium.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps webkit chromium

      - name: Firestore security rules tests
        run: npm run test:rules

      - name: End-to-end tests (iPhone viewport)
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Live deploy on every push to main. Secrets cannot be referenced in job-level
  # `if:` expressions, so this job simply fails until FIREBASE_SERVICE_ACCOUNT
  # and FIREBASE_PROJECT_ID are configured (documented in the README).
  deploy_live:
    name: Deploy to live channel
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with production Firebase config
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 }}
          channelId: live
          projectId: cattrack-8aa49

  # Preview channel per PR (auto channel id, 30-day expiry). The action
  # comments the preview URL on the pull request.
  deploy_preview:
    name: Deploy PR preview channel
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with production Firebase config
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 }}
          projectId: cattrack-8aa49
          expires: 30d
