# CatTrack CI: quality gates on every push/PR, Firebase Hosting deploys after.
#
# Required repository configuration (see README "CI & deploys"):
#   Secrets:   FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 — uploaded by
#              `firebase init hosting:github`; the name is the CLI's own, kept
#              so the key it minted is the only one that ever exists.
#   Variables: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN,
#              VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_STORAGE_BUCKET,
#              VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID
# The deploy jobs fail until those exist — that is intentional, not a flake.
#
# These are the ONLY workflows allowed to deploy. `firebase init hosting:github`
# also writes firebase-hosting-{merge,pull-request}.yml, which trigger on the
# same events but skip the quality gates AND build without the VITE_FIREBASE_*
# config — an ungated deploy of a bundle with no Firebase config. They were
# deleted; if the CLI regenerates them, delete them again.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gates run as parallel jobs; `quality` below joins them so the deploy
  # jobs (and any branch protection) have one name to wait on.
  checks:
    name: Lint, types, unit, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `build` runs `tsc -b --noEmit` itself, so there is no separate
      # typecheck step here.
      - name: Build
        run: npm run build

      - name: Unit + component tests (with coverage)
        run: npm run test

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # test:rules wraps `firebase emulators:exec`; the Firestore emulator needs a
  # JDK on the runner.
  rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Firestore security rules tests
        run: npm run test:rules

  # E2E runs on Safari (WebKit) and Chrome (Chromium), split across runners —
  # each has its own emulator, so the shards cannot interfere — and each
  # installs only the browser it needs.
  e2e:
    name: E2E (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Safari iPhone 14 Pro
            browser: webkit
            projects: --project=safari-iphone-14-pro
          - name: Safari layout (12 mini, iPads)
            browser: webkit
            projects: --project=safari-iphone-12-mini --project=safari-ipad-mini --project=safari-ipad-pro-landscape
          - name: Chrome
            browser: chromium
            projects: --project=chrome-phone --project=chrome-desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      # The cache holds the browser, not the system libraries it links against.
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      # Not `npm run test:e2e`: the projects flag has to land inside the quoted
      # playwright command that emulators:exec runs.
      - name: End-to-end tests
        run: >
          npx firebase emulators:exec --only auth,firestore --project demo-cattrack
          "playwright test ${{ matrix.projects }}"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}-${{ strategy.job-index }}
          path: playwright-report/
          if-no-files-found: ignore

  quality:
    name: Quality gates
    needs: [checks, rules, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All gates passed"

  # Firestore rules go live BEFORE the Hosting bundle that relies on them, so a
  # new field is never written against rules that still deny it. Rules only:
  # indexes stay manual. The service account behind the secret needs the
  # "Firebase Rules Admin" role on top of what Hosting deploys require.
  deploy_rules:
    name: Deploy Firestore rules
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy rules
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase deploy --only firestore:rules --project cattrack-8aa49
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 }}

  # Live deploy on every push to main. Secrets cannot be referenced in job-level
  # `if:` expressions, so this job simply fails until FIREBASE_SERVICE_ACCOUNT
  # and FIREBASE_PROJECT_ID are configured (documented in the README).
  deploy_live:
    name: Deploy to live channel
    needs: [quality, deploy_rules]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with production Firebase config
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 }}
          channelId: live
          projectId: cattrack-8aa49

  # Preview channel per PR (auto channel id, 30-day expiry). The action
  # comments the preview URL on the pull request.
  deploy_preview:
    name: Deploy PR preview channel
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with production Firebase config
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATTRACK_8AA49 }}
          projectId: cattrack-8aa49
          expires: 30d
